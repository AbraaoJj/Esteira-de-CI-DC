name: Esteira de Integracao e Entrega Continua (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-e-teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm install

      - name: Executar Testes Automatizados
        run: npm test
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      - name: Build da Aplicacao
        run: npm run build

      - name: Deploy Automatizado (Simulado)
        run: echo "Deploy em producao realizado com sucesso!"
